name: Apply Nov 16 weekly update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Nov 16 patch script
        run: python3 apply-nov16-update.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Weekly update w/e 16 Nov: AMFI Oct data (AUM Rs 83.39 lakh cr, SIF Rs 42,670 cr), tokenised collateral goes live (BUIDL/StanChart, Securitize-Ethena, GL1 Org), Saudi CMA consultation to 20 Dec, BNY 400+ AI solutions and Citi Custody+ metrics, AIFMD II patchwork"; git push; fi

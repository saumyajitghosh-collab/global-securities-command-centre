name: Apply Sep 28 weekly update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Sep 28 patch script
        run: python3 apply-sep28-update.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Weekly update 28 Sep: SIF pipeline (AlphaGrep, Axis, HDFC, Tata AAA NFO), tokenised funds go institutional (ChinaAMC, mWIN, ARK, UMYR), Standish acquires NCM"; git push; fi

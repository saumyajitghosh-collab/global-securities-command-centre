name: Apply personalisation update
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run personalisation patch script
        run: python3 apply-personal-update.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Personalisation v1: market selection + modular pricing, role lens, themes, trigger watchlist, custom-research menu"; git push; fi
